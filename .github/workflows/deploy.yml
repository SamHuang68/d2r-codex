name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build

      # 發布前先用瀏覽器載入「剛建好的 dist」跑冒煙（含首頁與各分頁 JS 預算）：壞的建置不要上線。
      # 直接推到 main 不會經過 PR 的 CI；先前首頁 JS 超過預算的建置就是這樣發布出去、事後才在線上冒煙測試變紅。
      - name: Smoke test the production build before publishing
        run: node scripts/smoke_dist.mjs
        env:
          SMOKE_CHANNEL: chrome

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # 部署後對「線上網址」再跑一次冒煙測試：上線後壞掉（整頁空白、載入錯誤）會讓這個工作流程失敗，GitHub 會通知，不必等人發現。
      # 重試是因為 Pages 發布後需要一點時間傳播。
      - name: Smoke test the live site
        run: node scripts/smoke_dist.mjs --url "${{ steps.deployment.outputs.page_url }}" --retries 4 --delay 30
        env:
          SMOKE_CHANNEL: chrome
