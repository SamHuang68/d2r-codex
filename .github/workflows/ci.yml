name: CI

# 每個對 main 的 Pull Request 都跑：型別檢查、計算引擎測試、建置、chunk 循環匯入檢查、正式建置的瀏覽器冒煙測試、圖示解析測試。
# 只負責「檢查」，不部署；部署仍由 deploy.yml 在推到 main 時執行。
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# 同一個 PR 又推了新提交時，取消還在跑的舊檢查
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: 型別檢查與引擎測試
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run lint

      - name: Data English coverage
        run: node scripts/check_data_i18n.mjs

      - name: Item image mirror
        run: node scripts/sync_item_image_mirror.mjs

      - name: Engine tests
        run: npm run test:engine

      # 建置也要過，而且 chunk 之間不能有循環匯入：循環在開發伺服器與建置都不會報錯，
      # 但上線後會整頁空白（Cannot access 'x' before initialization）。
      - name: Build
        run: npm run build

      - name: Check chunk cycles
        run: node scripts/check_chunk_cycles.mjs

      # 真的用瀏覽器載入正式建置：各頁有內容、配裝模擬可套用流派、手機版無橫向捲動、無頁面錯誤。
      # 開發伺服器、型別檢查與單元測試都抓不到的「正式建置才會出的錯」（例如整頁空白）在這一步擋下。
      - name: Browser smoke test (production build)
        run: node scripts/smoke_dist.mjs
        env:
          SMOKE_CHANNEL: chrome

      # 圖示解析與部位檢查（1776 項）
      - name: Item resolver tests
        run: npm test
